<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="case-tracker-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="案件追蹤">
<title>草草・案件追蹤明細表</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Alfa+Slab+One&family=Fredoka:wght@500;600;700&family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e6d3a8;
    --surface: #f3e6c4;
    --surface2: #ecdcb2;
    --surface3: #e0cb98;
    --border: #2b2118;
    --border2: #2b2118;
    --text: #2b2118;
    --text2: #5c4630;
    --text3: #8b7455;
    --accent: #b8402a;
    --accent2: #d4583a;
    --accent-dim: rgba(184,64,42,0.14);
    --red: #b8321e;
    --red-dim: rgba(184,50,30,0.14);
    --green: #5b7a35;
    --blue: #25607a;
    --blue-dim: rgba(37,96,122,0.14);
    --cat1: #d9a22b;
    --cat2: #25607a;
    --cat3: #5b7a35;
    --cat4: #d2691e;
    --radius: 4px;
    --radius2: 6px;
    --ink: #2b2118;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Noto Sans TC',sans-serif; font-size:14px; min-height:100vh; }

  /* ── TOPBAR ── */
  .topbar {
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:0 32px; display:flex; align-items:center; gap:24px;
    height:56px; position:sticky; top:0; z-index:100;
  }
  .topbar-logo { font-family:'Noto Serif TC',serif; font-size:16px; font-weight:700; color:var(--accent); letter-spacing:.04em; white-space:nowrap; }
  .topbar-tabs { display:flex; gap:4px; margin-left:auto; }
  .tab-btn { padding:6px 18px; border-radius:6px; border:none; background:transparent; color:var(--text2); font-family:'Noto Sans TC',sans-serif; font-size:13px; cursor:pointer; transition:all .18s; }
  .tab-btn:hover { background:var(--surface3); color:var(--text); }
  .tab-btn.active { background:var(--accent-dim); color:var(--accent); }
  .btn-add-case { padding:7px 18px; border-radius:6px; border:1px solid var(--accent); background:transparent; color:var(--accent); font-family:'Noto Sans TC',sans-serif; font-size:13px; cursor:pointer; transition:all .18s; white-space:nowrap; }
  .btn-add-case:hover { background:var(--accent-dim); }

  /* ── MAIN ── */
  .main-wrapper { max-width:1500px; margin:0 auto; padding:0 32px 60px; }

  /* ── DASHBOARD ── */
  .dashboard-sticky {
    position:sticky; top:56px; z-index:90;
    background:var(--bg); padding:20px 0 16px; margin-bottom:0;
  }
  .dashboard { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  .dash-card {
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius2);
    padding:20px 22px; position:relative; overflow:hidden; transition:border-color .18s;
  }
  .dash-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; }
  .dash-card:nth-child(1)::before { background:var(--cat1); }
  .dash-card:nth-child(2)::before { background:var(--cat2); }
  .dash-card:nth-child(3)::before { background:var(--cat3); }
  .dash-card:nth-child(4)::before { background:var(--cat4); }
  /* ── dashboard card: clickable + active filter state ── */
  .dash-card { cursor:pointer; transition:border-color .18s, box-shadow .18s, transform .1s; }
  .dash-card:hover { border-color:var(--border2); }
  .dash-card-active {
    border-color:var(--accent) !important;
    box-shadow:0 0 0 2px rgba(184,64,42,.15);
  }
  .dash-card:nth-child(1).dash-card-active { border-color:var(--cat1) !important; box-shadow:0 0 0 2px rgba(184,64,42,.2); }
  .dash-card:nth-child(2).dash-card-active { border-color:var(--cat2) !important; box-shadow:0 0 0 2px rgba(37,96,122,.2); }
  .dash-card:nth-child(3).dash-card-active { border-color:var(--cat3) !important; box-shadow:0 0 0 2px rgba(91,122,53,.2); }
  .dash-card:nth-child(4).dash-card-active { border-color:var(--cat4) !important; box-shadow:0 0 0 2px rgba(210,105,30,.2); }
  .dash-label { font-size:11px; color:var(--text3); letter-spacing:.08em; margin-bottom:12px; text-transform:uppercase; }
  .dash-row { display:flex; align-items:baseline; gap:8px; }
  .dash-count { font-family:'DM Mono',monospace; font-size:40px; font-weight:500; line-height:1; }
  .dash-card:nth-child(1) .dash-count { color:var(--cat1); }
  .dash-card:nth-child(2) .dash-count { color:var(--cat2); }
  .dash-card:nth-child(3) .dash-count { color:var(--cat3); }
  .dash-card:nth-child(4) .dash-count { color:var(--cat4); }
  .dash-unit { font-size:13px; color:var(--text3); white-space:nowrap; }

  /* ── SECTION HEADER ── */
  .section-header { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .section-title { font-family:'Noto Serif TC',serif; font-size:15px; font-weight:600; color:var(--text); }
  .section-count { font-family:'DM Mono',monospace; font-size:11px; background:var(--surface3); border:1px solid var(--border); color:var(--text2); padding:2px 8px; border-radius:20px; }

  /* ── TABLE — 主頁文字全體 +3pt (原13px→16px) ── */
  .table-wrap { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius2); overflow:hidden; }
  .case-table { width:100%; border-collapse:collapse; }
  .case-table thead th {
    background:var(--surface2); padding:12px 16px; text-align:left;
    font-size:13px; font-weight:500; color:var(--text3);
    letter-spacing:.06em; text-transform:uppercase;
    border-bottom:1px solid var(--border); white-space:nowrap; user-select:none;
  }
  .case-table thead th.sortable { cursor:pointer; }
  .case-table thead th.sortable:hover { color:var(--text2); }
  .sort-icon { margin-left:4px; opacity:.5; font-style:normal; }
  .case-table tbody tr { border-bottom:1px solid var(--border); transition:background .12s; cursor:pointer; }
  .case-table tbody tr:last-child { border-bottom:none; }
  .case-table tbody tr:hover { background:var(--surface2); }
  .case-table tbody tr.closed-row { opacity:.55; }
  /* td font-size bumped to 16px */
  .case-table td { padding:14px 16px; vertical-align:middle; font-size:16px; }

  .close-check { width:18px; height:18px; accent-color:var(--green); cursor:pointer; }
  .td-check { text-align:center; width:44px; }

  .cat-badge { display:inline-block; font-size:12px; padding:4px 10px; border-radius:20px; white-space:nowrap; font-weight:500; }
  .cat-1 { background:rgba(184,64,42,.12); color:var(--cat1); border:1px solid rgba(184,64,42,.2); }
  .cat-2 { background:rgba(37,96,122,.12); color:var(--cat2); border:1px solid rgba(37,96,122,.2); }
  .cat-3 { background:rgba(91,122,53,.10); color:var(--cat3); border:1px solid rgba(91,122,53,.2); }
  .cat-4 { background:rgba(210,105,30,.12); color:var(--cat4); border:1px solid rgba(210,105,30,.2); }

  .pri-badge { display:inline-block; font-size:12px; padding:4px 10px; border-radius:4px; white-space:nowrap; }
  .pri-urgent { background:var(--red-dim); color:var(--red); }
  .pri-track { background:var(--blue-dim); color:var(--blue); }
  .pri-record { background:var(--surface3); color:var(--text3); }
  .pri-submitted { background:rgba(91,122,53,.12); color:var(--green); }

  .deadline-urgent { color:var(--red); font-weight:500; font-family:'DM Mono',monospace; font-size:15px; }
  .deadline-normal { color:var(--text2); font-family:'DM Mono',monospace; font-size:15px; }
  .deadline-empty { color:var(--text3); font-size:15px; }

  .case-inline { font-size:16px; color:var(--text); }
  .case-inline .c-name { font-weight:600; color:var(--text); }
  .case-inline .c-sep { color:var(--text3); margin:0 6px; }
  .case-inline .c-title { color:var(--text2); }

  .empty-row td { text-align:center; padding:48px; color:var(--text3); font-size:15px; }
  .td-accident { font-family:'DM Mono',monospace; font-size:15px; color:var(--blue); }

  /* ═══════════════════════════════════════
     VIEW PANEL (詳情面板 — 不是編輯)
  ═══════════════════════════════════════ */
  .view-overlay {
    display:none; position:fixed; inset:0;
    background:rgba(10,12,16,.78); z-index:200;
    align-items:center; justify-content:center;
    backdrop-filter:blur(4px);
  }
  .view-overlay.open { display:flex; }

  .view-panel {
    background:var(--surface);
    border:1px solid var(--border2);
    border-radius:16px;
    width:min(1060px, 96vw);
    max-height:92vh;
    overflow-y:auto;
    box-shadow:0 24px 80px rgba(0,0,0,.55);
    display:flex;
    flex-direction:column;
  }

  /* panel header */
  .vp-header {
    display:flex; align-items:center; gap:12px;
    padding:22px 32px 18px;
    border-bottom:1px solid var(--border);
    position:sticky; top:0; background:var(--surface); z-index:5;
  }
  .vp-cat-dot { width:11px; height:11px; border-radius:50%; flex-shrink:0; }
  .vp-title { font-family:'Noto Serif TC',serif; font-size:19px; font-weight:700; color:var(--text); flex:1; }
  .vp-close { background:var(--surface3); border:none; color:var(--text2); width:32px; height:32px; border-radius:6px; cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; transition:all .15s; }
  .vp-close:hover { background:var(--red-dim); color:var(--red); }

  .vp-body { padding:28px 32px; display:flex; flex-direction:column; gap:28px; }

  /* ── INFO CARD ── */
  .vp-info-card {
    background:var(--surface2);
    border:1px solid var(--border);
    border-radius:var(--radius2);
    padding:24px 28px;
    position:relative;
  }
  .vp-info-card-header {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:20px;
  }
  .vp-info-card-label { font-size:11px; color:var(--text3); letter-spacing:.1em; text-transform:uppercase; }
  .btn-edit-case {
    padding:6px 16px; border-radius:6px;
    border:1px solid var(--border2);
    background:var(--surface3); color:var(--text2);
    font-family:'Noto Sans TC',sans-serif; font-size:13px;
    cursor:pointer; transition:all .15s;
    display:flex; align-items:center; gap:6px;
  }
  .btn-edit-case:hover { border-color:var(--accent); color:var(--accent); }

  /* info grid */
  .vp-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px 32px; }
  .vp-field { display:flex; flex-direction:column; gap:5px; }
  .vp-field-label { font-size:11px; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; }
  .vp-field-value { font-size:16px; color:var(--text); line-height:1.5; }
  .vp-field-value.mono { font-family:'DM Mono',monospace; font-size:15px; }
  .vp-field-value.urgent { color:var(--red); font-weight:600; }
  .vp-field-value.empty { color:var(--text3); font-size:14px; }
  .vp-field-value .cat-badge { font-size:13px; }
  .vp-field-value .pri-badge { font-size:13px; }

  /* ── PROGRESS SECTION ── */
  .vp-progress-card {
    background:var(--surface2);
    border:1px solid var(--border);
    border-radius:var(--radius2);
    padding:24px 28px;
  }
  .vp-progress-header {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:20px;
  }
  .vp-progress-title { font-size:11px; color:var(--text3); letter-spacing:.1em; text-transform:uppercase; }

  /* timeline list */
  .vp-log-list { display:flex; flex-direction:column; gap:0; }
  .vp-log-item {
    display:flex; gap:0;
    position:relative;
  }
  /* vertical line */
  .vp-log-item:not(:last-child) .vp-log-line::after {
    content:''; position:absolute;
    left:50%; top:20px; bottom:-14px;
    width:1px; background:var(--border2);
    transform:translateX(-50%);
  }
  .vp-log-left {
    display:flex; flex-direction:column; align-items:center;
    width:20px; flex-shrink:0; margin-right:18px; position:relative;
    padding-top:4px;
  }
  .vp-log-dot {
    width:10px; height:10px; border-radius:50%;
    background:var(--accent); border:2px solid var(--surface2);
    flex-shrink:0; z-index:1; position:relative;
  }
  .vp-log-line { position:absolute; left:50%; top:14px; bottom:0; width:1px; background:var(--border2); transform:translateX(-50%); }
  .vp-log-item:last-child .vp-log-line { display:none; }
  .vp-log-right {
    flex:1; padding-bottom:20px;
  }
  .vp-log-date {
    font-family:'DM Mono',monospace; font-size:13px; color:var(--accent);
    margin-bottom:6px; font-weight:500;
  }
  .vp-log-body {
    font-size:16px; color:var(--text); line-height:1.75;
    white-space:pre-wrap; word-break:break-word;
    background:var(--surface3); border:1px solid var(--border);
    border-radius:8px; padding:13px 16px;
  }
  .vp-log-body .clr-red { color:#e86060; }
  .vp-log-body .clr-blue { color:#6aaae8; }
  .vp-empty-log { color:var(--text3); font-size:14px; padding:8px 0; }

  /* ── ADD LOG inline ── */
  .vp-add-log { margin-top:4px; }
  .vp-add-toggle {
    display:flex; align-items:center; gap:8px;
    padding:9px 16px; border-radius:var(--radius);
    border:1px dashed var(--border2); background:transparent;
    color:var(--text3); font-family:'Noto Sans TC',sans-serif;
    font-size:13px; cursor:pointer; transition:all .15s; width:100%;
    justify-content:center;
  }
  .vp-add-toggle:hover { border-color:var(--accent); color:var(--accent); }
  .vp-add-form {
    display:none; margin-top:12px;
    background:var(--surface3); border:1px solid var(--border2);
    border-radius:var(--radius2); padding:18px;
  }
  .vp-add-form.open { display:block; }
  .vp-add-top { display:grid; grid-template-columns:130px 1fr; gap:10px; align-items:start; margin-bottom:10px; }
  .vp-add-toolbar { display:flex; align-items:center; gap:6px; margin-bottom:10px; }
  .toolbar-label { font-size:12px; color:var(--text3); margin-right:2px; }
  .clr-btn { padding:3px 10px; border-radius:4px; border:1px solid var(--border2); background:var(--surface); cursor:pointer; font-size:12px; font-weight:600; transition:all .15s; }
  .clr-btn.red { color:#e86060; }
  .clr-btn.red:hover { background:rgba(232,96,96,.18); border-color:#e86060; }
  .clr-btn.blue { color:#6aaae8; }
  .clr-btn.blue:hover { background:rgba(106,170,232,.18); border-color:#6aaae8; }
  .clr-btn.clr-clear { color:var(--text2); font-weight:400; }
  .clr-btn.clr-clear:hover { color:var(--text); }
  .vp-add-actions { display:flex; justify-content:flex-end; gap:8px; }

  /* ── IMAGES in view panel ── */
  .vp-img-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
  .vp-img-thumb { aspect-ratio:1; border-radius:8px; overflow:hidden; border:1px solid var(--border); cursor:pointer; transition:opacity .15s; }
  .vp-img-thumb:hover { opacity:.85; }
  .vp-img-thumb img { width:100%; height:100%; object-fit:cover; }

  /* ═══════════════════════════════════════
     EDIT MODAL (編輯視窗)
  ═══════════════════════════════════════ */
  .modal-overlay {
    display:none; position:fixed; inset:0;
    background:rgba(10,12,16,.82); z-index:300;
    align-items:center; justify-content:center;
    backdrop-filter:blur(4px);
  }
  .modal-overlay.open { display:flex; }
  .modal {
    background:var(--surface); border:1px solid var(--border2); border-radius:16px;
    width:min(740px,96vw); max-height:92vh; overflow-y:auto;
    box-shadow:0 24px 80px rgba(0,0,0,.6);
  }
  .modal-header { display:flex; align-items:center; gap:12px; padding:22px 28px 18px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface); z-index:5; }
  .modal-cat-indicator { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .modal-title { font-family:'Noto Serif TC',serif; font-size:18px; font-weight:700; color:var(--text); flex:1; }
  .modal-close { background:var(--surface3); border:none; color:var(--text2); width:30px; height:30px; border-radius:6px; cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; transition:all .15s; }
  .modal-close:hover { background:var(--red-dim); color:var(--red); }

  .modal-body { padding:24px 28px; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
  .form-row.single { grid-template-columns:1fr; }
  .form-group { display:flex; flex-direction:column; gap:6px; }
  .form-label { font-size:12px; color:var(--text3); letter-spacing:.06em; text-transform:uppercase; }
  .form-input,.form-select,.form-textarea {
    background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius);
    padding:10px 13px; color:var(--text); font-family:'Noto Sans TC',sans-serif;
    font-size:14px; outline:none; transition:border-color .15s;
  }
  .form-input:focus,.form-select:focus,.form-textarea:focus { border-color:var(--accent); }
  .form-select { cursor:pointer; }
  .form-textarea { resize:vertical; min-height:80px; line-height:1.65; }

  .modal-section { margin-top:22px; padding-top:18px; border-top:1px solid var(--border); }
  .modal-section-title { font-size:12px; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
  .modal-section-title::after { content:''; flex:1; height:1px; background:var(--border); }

  /* log in edit modal */
  .edit-log-list { display:flex; flex-direction:column; gap:8px; margin-bottom:14px; max-height:220px; overflow-y:auto; padding-right:4px; }
  .edit-log-entry { display:flex; gap:12px; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius); padding:11px 13px; position:relative; }
  .edit-log-entry::before { content:''; position:absolute; left:0; top:10%; bottom:10%; width:3px; background:var(--accent); border-radius:0 3px 3px 0; }
  .edit-log-date { font-family:'DM Mono',monospace; font-size:12px; color:var(--accent); white-space:nowrap; min-width:72px; padding-top:1px; }
  .edit-log-content { font-size:13px; color:var(--text); line-height:1.65; flex:1; white-space:pre-wrap; }
  .edit-log-content .clr-red { color:#e86060; }
  .edit-log-content .clr-blue { color:#6aaae8; }
  .log-delete { background:none; border:none; color:var(--text3); cursor:pointer; padding:0 2px; font-size:14px; transition:color .15s; flex-shrink:0; }
  .log-delete:hover { color:var(--red); }

  .add-log-area { display:flex; flex-direction:column; gap:8px; }
  .add-log-top { display:grid; grid-template-columns:130px 1fr; gap:8px; align-items:start; }
  .add-log-toolbar { display:flex; align-items:center; gap:6px; padding:4px 0; }
  .btn-add-log { background:var(--accent-dim); border:1px solid rgba(184,64,42,.3); color:var(--accent); padding:8px 16px; border-radius:var(--radius); cursor:pointer; font-size:13px; white-space:nowrap; transition:all .15s; }
  .btn-add-log:hover { background:rgba(184,64,42,.22); }

  /* img in edit modal */
  .img-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:10px; }
  .img-thumb { aspect-ratio:1; border-radius:6px; overflow:hidden; border:1px solid var(--border); position:relative; background:var(--surface2); }
  .img-thumb img { width:100%; height:100%; object-fit:cover; }
  .img-thumb .del-img { position:absolute; top:4px; right:4px; background:rgba(16,18,22,.8); border:none; color:var(--text2); width:22px; height:22px; border-radius:4px; cursor:pointer; font-size:12px; display:none; align-items:center; justify-content:center; }
  .img-thumb:hover .del-img { display:flex; }
  .upload-btn { background:var(--surface2); border:1px dashed var(--border2); border-radius:6px; aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; color:var(--text3); font-size:11px; gap:4px; transition:all .15s; }
  .upload-btn:hover { border-color:var(--accent); color:var(--accent); }
  .upload-btn .up-icon { font-size:20px; }

  .modal-footer { display:flex; gap:10px; padding:16px 28px 24px; border-top:1px solid var(--border); justify-content:flex-end; }
  .btn-cancel { background:var(--surface3); border:1px solid var(--border); color:var(--text2); padding:9px 22px; border-radius:var(--radius); cursor:pointer; font-size:14px; font-family:'Noto Sans TC',sans-serif; transition:all .15s; }
  .btn-cancel:hover { color:var(--text); border-color:var(--border2); }
  .btn-save { background:var(--accent); border:none; color:#f3e6c4; padding:9px 26px; border-radius:var(--radius); cursor:pointer; font-size:14px; font-weight:600; font-family:'Noto Sans TC',sans-serif; transition:all .15s; }

/* ════════════════════════════════════
   MOBILE RWD  (≤768px)
════════════════════════════════════ */
@media (max-width: 768px) {

  /* ── topbar: 只留 logo，桌面 tabs 隱藏 ── */
  .topbar { padding:0 16px; height:52px; }

  /* ── main wrapper ── */

  /* ── show search box on mobile ── */
  .mobile-search-wrap { display:flex !important; }

  .section-header { flex-wrap:nowrap; align-items:center; }

  .mobile-empty {
    text-align:center; padding:48px 24px;

  .vp-info-card { padding:16px 16px; }
  .vp-grid { grid-template-columns:1fr 1fr; gap:14px 20px; }

  .vp-progress-card { padding:16px 16px; }

  .vp-log-body { font-size:14px; }
  .vp-add-top { grid-template-columns:110px 1fr; }
  #vp-img-grid { grid-template-columns:repeat(3,1fr) !important; }
  .vp-section-heading { font-size:14px; }
  .vp-progress-title-lg { font-size:14px; }
  .btn-edit-case { font-size:12px; padding:5px 12px; }

  /* ── edit modal: full-screen slide-up ── */
  .modal-overlay { align-items:flex-end; }

    width:100%; border-radius:20px 20px 0 0;

  .modal-body { padding:16px 18px; }
  .form-row { grid-template-columns:1fr 1fr; }
  /* triple-col → two rows on mobile */
  .form-row[style*="1fr 1fr 1fr"] { grid-template-columns:1fr 1fr !important; }
  .modal-footer { padding:12px 18px 20px; }
  .add-log-top { grid-template-columns:110px 1fr; }
  .img-grid { grid-template-columns:repeat(3,1fr); }

  /* ── triple row: stack all on mobile ── */
  .triple-row { grid-template-columns:1fr !important; }
  .triple-row .form-group { grid-column:auto; }
  /* ── name + category: stack on mobile ── */
  .name-cat-row { grid-template-columns:1fr !important; }
  .side-row { grid-template-columns:1fr !important; }
  .seg-btn { font-size:13px; padding:10px 6px; }

/* Desktop: hide mobile-only elements */
@media (min-width: 769px) {
  .mobile-card-list { display:none; }
  .mobile-nav { display:none !important; }
  .mobile-fab { display:none; }
  .mobile-closed-btn { display:none !important; }

<script>
// ═══════════════════════════════════════════════════
//  FIREBASE SETUP  (Realtime Database, compat SDK)
// ═══════════════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyC0Sq4zkCxpo0ilUKrh2viyE7CozxXAgDI",
  authDomain: "case-tracker-41237.firebaseapp.com",
  databaseURL: "https://case-tracker-41237-default-rtdb.firebaseio.com",
  projectId: "case-tracker-41237",
  storageBucket: "case-tracker-41237.firebasestorage.app",
  messagingSenderId: "140725383208",
  appId: "1:140725383208:web:f34f240d249b28471cc51d"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const casesRef = db.ref('cases');

// ═══════════════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════════════
const CAT_NAMES = {1:'新契約・加保',2:'契約變更・退保',3:'壽險/產險理賠',4:'車禍追蹤'};
const CAT_COLORS = {1:'var(--cat1)',2:'var(--cat2)',3:'var(--cat3)',4:'var(--cat4)'};
const PRI_NAMES = {urgent:'時效優先',track:'待追蹤',record:'記錄待辦',submitted:'已送件'};
const PRI_CLS   = {urgent:'pri-urgent',track:'pri-track',record:'pri-record',submitted:'pri-submitted'};
const PRI_SET_DEFAULT = [['urgent','時效優先'],['track','待追蹤'],['record','記錄待辦']];
const PRI_SET_FILING  = [['submitted','已送件'],['track','待追蹤']];
function priSetFor(cat) { return (cat==2||cat==3) ? PRI_SET_FILING : PRI_SET_DEFAULT; }
function priLabel(c) {
  if((c.category==2||c.category==3) && c.priority==='track') return '待追蹤';
  return PRI_NAMES[c.priority] || '';
}
function splitClaim(str) {
  str=(str||'').trim(); if(!str) return ['',''];
  const m=str.match(/^(.*?)[\s　]+([\d\-+()#\s]{5,})$/);
  return m ? [m[1].trim(), m[2].trim()] : [str,''];
}
function sideInfo(c, side) {
  const o = side==='our';
  const insurer = o ? (c.ourInsurer ?? c.insurer ?? '') : (c.theirInsurer ?? '');
  let name = o ? c.ourCName : c.theirCName, phone = o ? c.ourCPhone : c.theirCPhone;
  if(name===undefined && phone===undefined){
    const old = o ? c.ourClaim : c.theirClaim;
    if(old!==undefined) [name,phone]=splitClaim(old);
    else if(o){ name=c.claimName||''; phone=c.claimPhone||''; }
  }
  return { insurer, name:name||'', phone:phone||'', no:(o?c.ourNo:c.theirNo)??'' };
}

let cases = [];
let currentId = null;
let viewId    = null;
let sortField = 'priority';
let sortDir   = 1;
let modalLogs = [];
let modalImgs = [];
let activeFilter = null; // null = 全部, 1-4 = 分類篩選
let searchKeyword = ''; // mobile search string
let desktopSearchKeyword = ''; // desktop search string

// ── Firebase sync ──
function save(c) {
  // save single case object to Firebase
  casesRef.child(c.id).set(c);
}
function saveDelete(id) {
  casesRef.child(id).remove();
}

// Listen for real-time updates
casesRef.on('value', snap => {
  const val = snap.val() || {};
  cases = Object.values(val);
  renderAll();
});

// ── Helpers ──
function uid()  { return Date.now() + '_' + Math.random().toString(36).slice(2); }
function esc(s) { if(!s)return''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function isUrgent(d) {
  if(!d) return false;
  const diff = (new Date(d) - new Date()) / 86400000;
  return diff >= 0 && diff <= 30;
}
function addMonth(d) {
  if(!d) return '';
  const x = new Date(d); x.setMonth(x.getMonth()+1); return x.toISOString().slice(0,10);
}

// ── Loading indicator ──
function showLoading(show) {
  const el = document.getElementById('loading-bar');
  if(el) el.style.display = show ? '' : 'none';
}

// ── Dashboard ──
function updateDashboard() {
  const p = cases.filter(c => !c.closed);
  for(let i=1;i<=4;i++)
    document.getElementById('cnt'+i).textContent = p.filter(c=>c.category==i).length;
}

// ── Inline name·title ──
function caseInline(c) {
  const n=esc(c.name||''), t=esc(c.title||'（未命名）');
  if(!n) return `<span class="case-inline"><span class="c-title">${t}</span></span>`;
  return `<span class="case-inline"><span class="c-name">${n}</span><span class="c-sep">·</span><span class="c-title">${t}</span></span>`;
}

// ── Log HTML render ──
function renderLogHtml(stored) {
  return (stored||'')
    .replace(/\{clr-red\}([\s\S]*?)\{\/clr-red\}/g,'<span class="clr-red">$1</span>')
    .replace(/\{clr-blue\}([\s\S]*?)\{\/clr-blue\}/g,'<span class="clr-blue">$1</span>');
}

// ════════════════════════════════════
//  DESKTOP TABLE RENDER
// ════════════════════════════════════
function renderPending() {
  const tbody = document.getElementById('pending-tbody');
  if(!tbody) return;
  let data = cases.filter(c => !c.closed);
  if(activeFilter) {
    data = data.filter(c => c.category == activeFilter);
  }
  if(desktopSearchKeyword) {
    const kw = desktopSearchKeyword.toLowerCase();
    data = data.filter(c =>
      (c.name||'').toLowerCase().includes(kw) ||
      (c.title||'').toLowerCase().includes(kw)
    );
  }
  if(sortField) {
    data.sort((a,b) => {
      let va=a[sortField]||'', vb=b[sortField]||'';
      if(sortField==='priority'){const o={urgent:0,submitted:1,track:2,record:3};va=o[va]??9;vb=o[vb]??9;}
      if(sortField==='category'){va=parseInt(va);vb=parseInt(vb);}
      return va<vb?-sortDir:va>vb?sortDir:0;
    });
  }
  document.getElementById('pending-count').textContent = data.length+' 件';
  if(!data.length){tbody.innerHTML='<tr class="empty-row"><td colspan="7">目前無待辦案件 🎉</td></tr>';return;}
  tbody.innerHTML = data.map(c=>`
    <tr onclick="openView('${c.id}')">
      <td class="td-check" onclick="event.stopPropagation()">
        <input type="checkbox" class="close-check" ${c.closed?'checked':''} onchange="toggleClose('${c.id}',this.checked)">
      </td>
      <td><span class="cat-badge cat-${c.category}">${CAT_NAMES[c.category]}</span></td>
      <td>${caseInline(c)}</td>
      <td>${c.handleDate?`<span class="deadline-normal">${c.handleDate}</span>`:'<span class="deadline-empty">—</span>'}</td>
      <td><span class="pri-badge ${PRI_CLS[c.priority]}">${priLabel(c)}</span></td>
      <td>${c.deadline?`<span class="${isUrgent(c.deadline)?'deadline-urgent':'deadline-normal'}">${c.deadline}${isUrgent(c.deadline)?' ⚠':''}</span>`:'<span class="deadline-empty">—</span>'}</td>
      <td class="td-accident">${c.accident||(c.category==4?'<span style="color:var(--blue)">—</span>':'')}</td>
    </tr>`).join('');
}

function renderClosed() {
  const tbody = document.getElementById('closed-tbody');
  if(!tbody) return;
  let data = cases.filter(c => c.closed);
  if(desktopSearchKeyword) {
    const kw = desktopSearchKeyword.toLowerCase();
    data = data.filter(c =>
      (c.name||'').toLowerCase().includes(kw) ||
      (c.title||'').toLowerCase().includes(kw)
    );
  }
  data.sort((a,b)=>{
    if(sortField==='closedAt'){let va=a.closedAt||'',vb=b.closedAt||'';return va<vb?-sortDir:va>vb?sortDir:0;}
    return (b.closedAt||'')<(a.closedAt||'')?-1:1;
  });
  document.getElementById('closed-count').textContent = data.length+' 件';
  if(!data.length){tbody.innerHTML='<tr class="empty-row"><td colspan="7">尚無已結案件</td></tr>';return;}
  tbody.innerHTML = data.map(c=>`
    <tr class="closed-row" onclick="openView('${c.id}')">
      <td class="td-check" onclick="event.stopPropagation()">
        <input type="checkbox" class="close-check" checked onchange="toggleClose('${c.id}',this.checked)">
      </td>
      <td><span class="cat-badge cat-${c.category}">${CAT_NAMES[c.category]}</span></td>
      <td>${caseInline(c)}</td>
      <td class="deadline-normal">${c.handleDate||'—'}</td>
      <td><span class="pri-badge ${PRI_CLS[c.priority]}">${priLabel(c)}</span></td>
      <td class="deadline-normal">${c.deadline||'—'}</td>
      <td class="deadline-normal">${c.closedAt||'—'}</td>
    </tr>`).join('');
}

// ════════════════════════════════════
//  MOBILE CARD RENDER
// ════════════════════════════════════
function isMobile() { return window.innerWidth <= 768; }

function renderMobileCards() {
  renderMobilePending();
  renderMobileClosed();
}

function renderMobilePending() {
  const el = document.getElementById('pending-cards');
  if(!el) return;
  let data = cases.filter(c => !c.closed);
  if(activeFilter) data = data.filter(c => c.category == activeFilter);
  if(searchKeyword) {
    const kw = searchKeyword.toLowerCase();
    data = data.filter(c =>
      (c.name||'').toLowerCase().includes(kw) ||
      (c.title||'').toLowerCase().includes(kw)
    );
  }
  el.innerHTML = data.length ? buildCards(data, false)
    : `<div class="mobile-empty">${activeFilter ? CAT_NAMES[activeFilter] + '<br>目前無待辦案件' : '目前無待辦案件 🎉'}</div>`;
}

function renderMobileClosed() {
  const el = document.getElementById('closed-cards');
  if(!el) return;
  let data = cases.filter(c => c.closed);
  data.sort((a,b) => (b.closedAt||'') > (a.closedAt||'') ? 1 : -1);
  el.innerHTML = data.length ? buildCards(data, true)
    : '<div class="mobile-empty">尚無已結案件</div>';
}

function buildCards(data, isClosed) {
  return data.map(c => {
    const name  = esc(c.name||'');
    const title = esc(c.title||'（未命名）');
    const nameHtml = name ? `${name}<span class="card-title-sep">　${title}</span>` : title;
    const deadlineClass = isUrgent(c.deadline)?'urgent': c.deadline?'':'empty';
    const deadlineVal   = c.deadline ? (isUrgent(c.deadline)?c.deadline+' ⚠':c.deadline) : '—';
    return `
      <div class="case-card cat-${c.category}${isClosed?' closed-card':''}" onclick="openView('${c.id}')">
        <div class="case-card-top">
          <div class="case-card-name">${nameHtml}</div>
          <input type="checkbox" class="case-card-check"
            ${isClosed?'checked':''}
            onclick="event.stopPropagation()"
            onchange="event.stopPropagation();toggleClose('${c.id}',this.checked)">
        </div>
        <div class="case-card-badges">
          <span class="cat-badge cat-${c.category}">${CAT_NAMES[c.category]}</span>
          <span class="pri-badge ${PRI_CLS[c.priority]}">${priLabel(c)}</span>
        </div>
        <div class="case-card-meta">
          <div class="case-card-meta-item">
            <div class="case-card-meta-label">截止日期</div>
            <div class="case-card-meta-val ${deadlineClass}">${deadlineVal}</div>
          </div>
          <div class="case-card-meta-item">
            <div class="case-card-meta-label">預計處理</div>
            <div class="case-card-meta-val ${c.handleDate?'':'empty'}">${c.handleDate||'—'}</div>
          </div>
        </div>
      </div>`;
  }).join('');
}


// ════════════════════════════════════
//  MOBILE FILTER BY CATEGORY
// ════════════════════════════════════


// ── Desktop search ──
function onDesktopSearch(val) {
  desktopSearchKeyword = val.trim();
  document.getElementById('desktop-search-clear').style.display = desktopSearchKeyword ? '' : 'none';
  renderPending();
  renderClosed();
}
function clearDesktopSearch() {
  desktopSearchKeyword = '';
  document.getElementById('desktop-search').value = '';
  document.getElementById('desktop-search-clear').style.display = 'none';
  renderPending();
  renderClosed();
}

// ── Mobile search ──
function onMobileSearch(val) {
  searchKeyword = val.trim();
  document.getElementById('mobile-search-clear').style.display = searchKeyword ? '' : 'none';
  renderMobilePending();
}
function clearSearch() {
  searchKeyword = '';
  document.getElementById('mobile-search').value = '';
  document.getElementById('mobile-search-clear').style.display = 'none';
  renderMobilePending();
}

function filterByCategory(cat) {
  activeFilter = (activeFilter === cat) ? null : cat; // toggle
  updateFilterUI();
  renderPending();
  renderMobilePending();
}

function clearFilter() {
  activeFilter = null;
  updateFilterUI();
  renderPending();
  renderMobilePending();
}

function updateFilterUI() {
  // Highlight active dash card
  for(let i=1;i<=4;i++){
    const el = document.getElementById('dash-card-'+i);
    if(!el) continue;
    if(activeFilter === i) {
      el.classList.add('dash-card-active');
    } else {
      el.classList.remove('dash-card-active');
    }
  }
  // Show filter badge
}

function renderAll() {
  renderPending();
  renderClosed();
  updateDashboard();
  renderMobileCards();
}

// ── Sort ──
function sortBy(field) {
  if(sortField===field) sortDir*=-1; else {sortField=field;sortDir=1;}
  document.querySelectorAll('.sort-icon').forEach(el=>el.textContent='↕');
  const el = document.getElementById('sort-'+field);
  if(el) el.textContent = sortDir===1?'↑':'↓';
  renderAll();
}

// ── Toggle close ──
function toggleClose(id, checked) {
  const c = cases.find(x=>x.id===id);
  if(!c) return;
  c.closed    = checked;
  c.closedAt  = checked ? new Date().toISOString().slice(0,10) : null;
  save(c);
}

// ── Desktop tab switch ──
function switchTab(tab) {
  document.getElementById('tab-pending').style.display = tab==='pending'?'':'none';
  document.getElementById('tab-closed').style.display  = tab==='closed'?'':'none';
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    b.classList.toggle('active',(i===0&&tab==='pending')||(i===1&&tab==='closed'));
  });
}

// ── Mobile tab (pending only) ──

// ── Mobile 已結案切換 ──
let mobileShowClosed = false;
function mobileToggleClosed() {
  mobileShowClosed = !mobileShowClosed;
  const btn = document.getElementById('mobile-closed-btn');
  if(btn) btn.classList.toggle('active', mobileShowClosed);
  if(mobileShowClosed) {
    mobileTab('closed');
  } else {
    mobileTab('pending');
  }
}

function mobileTab(tab) {
  switchTab(tab);
  // sync mobile closed btn state
  const btn = document.getElementById('mobile-closed-btn');
  if(btn) btn.classList.toggle('active', tab==='closed');
  mobileShowClosed = (tab==='closed');
}

// ════════════════════════════════════
//  VIEW PANEL
// ════════════════════════════════════
function openView(id) {
  viewId = id;
  const c = cases.find(x=>x.id===id);
  if(!c) return;

  document.getElementById('vp-cat-dot').style.background = CAT_COLORS[c.category];
  document.getElementById('vp-title').textContent =
    (c.name||'')+(c.name&&c.title?' · ':'')+(c.title||'案件詳情');

  const isCrash = c.category==4;
  let fields = [
    {label:'分類',   value:`<span class="cat-badge cat-${c.category}">${CAT_NAMES[c.category]}</span>`},
    {label:'優先級', value:`<span class="pri-badge ${PRI_CLS[c.priority]}">${priLabel(c)}</span>`},
  ];
  if(isCrash) fields.push({label:'事故日期',value:c.accident||'',mono:true,empty:!c.accident});
  fields.push({label:'截止日期',value:c.deadline||'',mono:true,urgent:c.deadline&&isUrgent(c.deadline),empty:!c.deadline});
  if(isCrash){
    const our = sideInfo(c,'our'), their = sideInfo(c,'their');
    const card=(t,cls,x)=>`<div class="vp-side ${cls}">
      <div class="vp-side-title">${t}</div>
      <div class="vp-cell"><span>保險公司</span><b class="${x.insurer?'':'empty'}">${x.insurer?esc(x.insurer):'—'}</b></div>
      <div class="vp-cell-row">
        <div class="vp-cell"><span>理賠人員</span><b class="${x.name?'':'empty'}">${x.name?esc(x.name):'—'}</b></div>
        <div class="vp-cell"><span>理賠電話</span><b class="mono ${x.phone?'':'empty'}">${x.phone?esc(x.phone):'—'}</b></div>
      </div>
      <div class="vp-cell"><span>賠案號碼</span><b class="mono ${x.no?'':'empty'}">${x.no?esc(x.no):'—'}</b></div>
    </div>`;
    fields.push({full:true,html:`<div class="vp-sides">${card('我方','vp-our',our)}${card('對方','vp-their',their)}</div>`});
  }

  document.getElementById('vp-info-grid').innerHTML = fields.map(f=>f.full?f.html:`
    <div class="vp-field">
      <div class="vp-field-label">${f.label}</div>
      <div class="vp-field-value ${f.mono?'mono':''} ${f.urgent?'urgent':''} ${f.empty?'empty':''}">
        ${f.empty?'—':f.value}${f.urgent?' ⚠':''}
      </div>
    </div>`).join('');

  renderViewLogs(c);

  renderViewImgs(cases.find(x=>x.id===viewId));

  document.getElementById('vp-add-form').classList.remove('open');
  document.getElementById('vp-log-date').value  = new Date().toISOString().slice(0,10);
  document.getElementById('vp-log-text').value  = '';
  document.getElementById('view-overlay').classList.add('open');
}


function renderViewImgs(c) {
  if(!c) return;
  const imgGrid = document.getElementById('vp-img-grid');
  if(!imgGrid) return;
  let html = (c.imgs||[]).map((src,i)=>`
    <div class="vp-img-thumb">
      <img src="${src}" onclick="openLightbox('${src}')">
      <button class="del-img" onclick="vpDeleteImg(${i})">✕</button>
    </div>`).join('');
  // always show upload button (max 20 imgs)
  if((c.imgs||[]).length < 20) {
    html += `<div class="upload-btn vp-upload-btn" onclick="document.getElementById('vp-file-input').click()">
      <span class="up-icon">＋</span><span>新增圖片</span>
    </div>`;
  }
  imgGrid.innerHTML = html;
}

function vpHandleImgUpload(e) {
  const c = cases.find(x=>x.id===viewId);
  if(!c) return;
  if(!c.imgs) c.imgs=[];
  const remaining = 20 - c.imgs.length;
  const files = Array.from(e.target.files).slice(0, remaining);
  let loaded = 0;
  files.forEach(file => {
    const r = new FileReader();
    r.onload = ev => {
      c.imgs.push(ev.target.result);
      loaded++;
      if(loaded === files.length) {
        save(c);
        renderViewImgs(c);
      }
    };
    r.readAsDataURL(file);
  });
  e.target.value = '';
}

function vpDeleteImg(i) {
  const c = cases.find(x=>x.id===viewId);
  if(!c || !c.imgs) return;
  if(!confirm('確定刪除此圖片？')) return;
  c.imgs.splice(i, 1);
  save(c);
  renderViewImgs(c);
  // update lightbox imgs
  lbImgs = c.imgs;
}

function renderViewLogs(c) {
  const logs = (c.logs||[]).slice().sort((a,b)=>a.dt<b.dt?-1:1);
  const el   = document.getElementById('vp-log-list');
  if(!logs.length){el.innerHTML='<div class="vp-empty-log">尚無進度記錄</div>';return;}
  el.innerHTML = logs.map((log,i)=>`
    <div class="vp-log-row" id="vplog-${i}">
      <div class="vp-log-date-col">
        <div>${log.dt||''}</div>
        <button class="vp-log-edit-btn" onclick="vpToggleEditLog(${i})">✎ 編輯</button>
      </div>
      <div class="vp-log-content-col">
        <div class="vp-log-body" id="vplog-body-${i}">${renderLogHtml(esc(log.html||log.text||''))}</div>
        <div class="vp-log-edit-row" id="vplog-edit-${i}" style="display:none;">
          <div class="vp-edit-top">
            <input class="form-input" type="date" id="vplog-edt-date-${i}" value="${log.dt||''}">
            <textarea class="form-textarea" id="vplog-edt-text-${i}" style="min-height:70px;">${log.html||log.text||''}</textarea>
          </div>
          <div class="vp-edit-toolbar">
            <span class="toolbar-label">標色：</span>
            <button class="clr-btn red"      onclick="vpEditApplyColor(${i},'red')">● 紅</button>
            <button class="clr-btn blue"     onclick="vpEditApplyColor(${i},'blue')">● 藍</button>
            <button class="clr-btn clr-clear" onclick="vpEditApplyColor(${i},'clear')">✕ 清除</button>
          </div>
          <div class="vp-edit-actions">
            <button class="btn-sm danger" onclick="vpDeleteLog(${i})">刪除</button>
            <button class="btn-sm"        onclick="vpCancelEditLog(${i})">取消</button>
            <button class="btn-sm accent" onclick="vpSaveEditLog(${i})">儲存</button>
          </div>
        </div>
      </div>
    </div>`).join('');
}

function closeView() {
  document.getElementById('view-overlay').classList.remove('open');
  viewId = null;
}
function closeViewOutside(e) { if(e.target===document.getElementById('view-overlay')) closeView(); }

function toggleAddLog() {
  const f = document.getElementById('vp-add-form');
  f.classList.toggle('open');
  if(f.classList.contains('open')){
    document.getElementById('vp-log-date').value = new Date().toISOString().slice(0,10);
    document.getElementById('vp-log-text').value = '';
  }
}

function vpApplyColor(color) { applyColorTo(document.getElementById('vp-log-text'),color); }

function vpSaveLog() {
  const dt   = document.getElementById('vp-log-date').value;
  const text = document.getElementById('vp-log-text').value.trim();
  if(!text) return;
  const c = cases.find(x=>x.id===viewId);
  if(!c) return;
  if(!c.logs) c.logs=[];
  c.logs.push({dt,html:text});
  save(c);
  renderViewLogs(c);
  document.getElementById('vp-add-form').classList.remove('open');
  document.getElementById('vp-log-text').value='';
}

function vpToggleEditLog(i) {
  const bodyEl = document.getElementById('vplog-body-'+i);
  const editEl = document.getElementById('vplog-edit-'+i);
  const isOpen = editEl.style.display!=='none';
  editEl.style.display = isOpen?'none':'';
  bodyEl.style.display = isOpen?'':'none';
}
function vpCancelEditLog(i) {
  const c = cases.find(x=>x.id===viewId); if(!c) return;
  const log = [...(c.logs||[])].sort((a,b)=>a.dt<b.dt?-1:1)[i];
  document.getElementById('vplog-edt-text-'+i).value = log?.html||log?.text||'';
  document.getElementById('vplog-edt-date-'+i).value = log?.dt||'';
  document.getElementById('vplog-edit-'+i).style.display='none';
  document.getElementById('vplog-body-'+i).style.display='';
}
function vpSaveEditLog(i) {
  const c = cases.find(x=>x.id===viewId); if(!c) return;
  const sorted  = [...(c.logs||[])].sort((a,b)=>a.dt<b.dt?-1:1);
  const log     = sorted[i];
  const origIdx = c.logs.indexOf(log);
  if(origIdx<0) return;
  c.logs[origIdx].dt   = document.getElementById('vplog-edt-date-'+i).value;
  c.logs[origIdx].html = document.getElementById('vplog-edt-text-'+i).value.trim();
  save(c); renderViewLogs(c);
}
function vpDeleteLog(i) {
  if(!confirm('確定刪除此進度記錄？')) return;
  const c = cases.find(x=>x.id===viewId); if(!c) return;
  const sorted  = [...(c.logs||[])].sort((a,b)=>a.dt<b.dt?-1:1);
  const log     = sorted[i];
  const origIdx = c.logs.indexOf(log);
  if(origIdx>=0) c.logs.splice(origIdx,1);
  save(c); renderViewLogs(c);
}
function vpEditApplyColor(i,color) { applyColorTo(document.getElementById('vplog-edt-text-'+i),color); }

// ════════════════════════════════════
//  EDIT MODAL
// ════════════════════════════════════
function openEditFromView() {
  const id = viewId;
  closeView();
  openEditModal(id);
}

function openEditModal(id) {
  currentId = id;
  const c = id ? cases.find(x=>x.id===id) : null;
  document.getElementById('btn-delete').style.display  = id?'':'none';
  document.getElementById('modal-heading').textContent = c?'編輯案件':'新增案件';
  document.getElementById('f-name').value        = c?.name||'';
  document.getElementById('f-cat').value         = c?.category||'1';
  document.getElementById('f-title').value       = c?.title||'';
  document.getElementById('f-priority').value    = c?.priority||'urgent';
  document.getElementById('f-handle-date').value = c?.handleDate||'';
  document.getElementById('f-deadline').value    = c?.deadline||'';
  document.getElementById('f-accident').value    = c?.accident||'';
  const _our = c ? sideInfo(c,'our') : {insurer:'',name:'',phone:'',no:''};
  const _their = c ? sideInfo(c,'their') : {insurer:'',name:'',phone:'',no:''};
  document.getElementById('f-our-insurer').value   = _our.insurer;
  document.getElementById('f-our-cname').value     = _our.name;
  document.getElementById('f-our-cphone').value    = _our.phone;
  document.getElementById('f-our-no').value        = _our.no;
  document.getElementById('f-their-insurer').value = _their.insurer;
  document.getElementById('f-their-cname').value   = _their.name;
  document.getElementById('f-their-cphone').value  = _their.phone;
  document.getElementById('f-their-no').value      = _their.no;
  modalLogs = c ? JSON.parse(JSON.stringify(c.logs||[])) : [];
  modalImgs = c ? JSON.parse(JSON.stringify(c.imgs||[])) : [];
  document.getElementById('log-date').value  = new Date().toISOString().slice(0,10);
  document.getElementById('log-text').value  = '';
  updateCatDot(); onCatChange(); renderEditLogs(); renderImgs();
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(()=>{ document.querySelector('.modal').scrollTop=0; },10);
}

function closeEditModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  currentId = null;
}
function closeModalOutside(e) { if(e.target===document.getElementById('modal-overlay')) closeEditModal(); }

function updateCatDot() {
  document.getElementById('modal-cat-dot').style.background = CAT_COLORS[document.getElementById('f-cat').value];
}
function setCat(v) {
  document.getElementById('f-cat').value = v;
  onCatChange();
}
function setPri(v) {
  document.getElementById('f-priority').value = v;
  renderPriBtns();
}
function renderPriBtns() {
  const cat = document.getElementById('f-cat').value;
  const set = priSetFor(cat);
  const inp = document.getElementById('f-priority');
  if(!set.some(x=>x[0]===inp.value)) inp.value = (set===PRI_SET_FILING) ? 'track' : 'urgent';
  document.getElementById('pri-btns').innerHTML = set.map(([v,label])=>
    `<button type="button" class="seg-btn seg-pri-${v}${inp.value===v?' active':''}" onclick="setPri('${v}')">${label}</button>`
  ).join('');
}
function onCatChange() {
  updateCatDot();
  const cur = document.getElementById('f-cat').value;
  document.querySelectorAll('#cat-btns .seg-btn').forEach(b=>b.classList.toggle('active', b.dataset.val===String(cur)));
  renderPriBtns();
  const cf = document.getElementById('crash-fields');
  cur==4 ? cf.classList.add('visible') : cf.classList.remove('visible');
}
function autoFillDeadline() {
  const acc = document.getElementById('f-accident').value;
  if(acc) document.getElementById('f-deadline').value = addMonth(acc);
}

function renderEditLogs() {
  const el = document.getElementById('edit-log-list');
  if(!modalLogs.length){el.innerHTML='<div style="color:var(--text3);font-size:13px;padding:6px 0;">尚無進度記錄</div>';return;}
  el.innerHTML = [...modalLogs].sort((a,b)=>a.dt<b.dt?-1:1).map((log)=>{
    const ri = modalLogs.indexOf(log);
    return `<div class="edit-log-entry">
      <div class="edit-log-date">${log.dt||''}</div>
      <div class="edit-log-content">${renderLogHtml(esc(log.html||log.text||''))}</div>
      <button class="log-delete" onclick="deleteLog(${ri})">✕</button>
    </div>`;
  }).join('');
}

function applyColorTo(ta, color) {
  const s=ta.selectionStart, e=ta.selectionEnd;
  if(s===e&&color!=='clear'){alert('請先選取要標色的文字');return;}
  const val=ta.value, sel=val.slice(s,e);
  let replaced;
  if(color==='clear'){
    const region=s===e?val:sel;
    const cleaned=region.replace(/\{clr-red\}([\s\S]*?)\{\/clr-red\}/g,'$1').replace(/\{clr-blue\}([\s\S]*?)\{\/clr-blue\}/g,'$1');
    if(s===e){ta.value=cleaned;return;}
    replaced=val.slice(0,s)+cleaned+val.slice(e);
  } else {
    replaced=val.slice(0,s)+`{clr-${color}}${sel}{/clr-${color}}`+val.slice(e);
  }
  ta.value=replaced; ta.focus();
}
function applyColor(color) { applyColorTo(document.getElementById('log-text'),color); }

function addLog() {
  const dt   = document.getElementById('log-date').value;
  const text = document.getElementById('log-text').value.trim();
  if(!text) return;
  modalLogs.push({dt,html:text});
  document.getElementById('log-text').value='';
  document.getElementById('log-date').value=new Date().toISOString().slice(0,10);
  renderEditLogs();
}
function deleteLog(i) { modalLogs.splice(i,1); renderEditLogs(); }

function renderImgs() {
  const grid = document.getElementById('img-grid');
  let html   = modalImgs.map((src,i)=>`
    <div class="img-thumb">
      <img src="${src}" onclick="window.open('${src}','_blank')">
      <button class="del-img" onclick="deleteImg(${i})">✕</button>
    </div>`).join('');
  if(modalImgs.length<8)
    html += `<div class="upload-btn" onclick="document.getElementById('file-input').click()">
      <span class="up-icon">＋</span><span>新增圖片</span></div>`;
  grid.innerHTML = html;
}
function handleImgUpload(e) {
  Array.from(e.target.files).slice(0,8-modalImgs.length).forEach(file=>{
    const r=new FileReader();
    r.onload=ev=>{modalImgs.push(ev.target.result);renderImgs();};
    r.readAsDataURL(file);
  });
  e.target.value='';
}
function deleteImg(i) { modalImgs.splice(i,1); renderImgs(); }

function saveCase() {
  const data = {
    name:      document.getElementById('f-name').value.trim(),
    category:  parseInt(document.getElementById('f-cat').value),
    title:     document.getElementById('f-title').value.trim(),
    priority:  document.getElementById('f-priority').value,
    handleDate:document.getElementById('f-handle-date').value,
    deadline:  document.getElementById('f-deadline').value,
    accident:  document.getElementById('f-accident').value,
    ourInsurer:   document.getElementById('f-our-insurer').value.trim(),
    ourCName:     document.getElementById('f-our-cname').value.trim(),
    ourCPhone:    document.getElementById('f-our-cphone').value.trim(),
    ourNo:        document.getElementById('f-our-no').value.trim(),
    theirInsurer: document.getElementById('f-their-insurer').value.trim(),
    theirCName:   document.getElementById('f-their-cname').value.trim(),
    theirCPhone:  document.getElementById('f-their-cphone').value.trim(),
    theirNo:      document.getElementById('f-their-no').value.trim(),
    logs:      modalLogs,
    imgs:      modalImgs,
  };
  if(currentId){
    const c = cases.find(x=>x.id===currentId);
    if(c){ Object.assign(c,data); save(c); }
  } else {
    const newCase = {id:uid(), closed:false, closedAt:null,
      createdAt:new Date().toISOString(), ...data};
    save(newCase);
  }
  closeEditModal();
}

function deleteCase() {
  if(!currentId) return;
  if(!confirm('確定要刪除此案件？此操作無法復原。')) return;
  saveDelete(currentId);
  closeEditModal();
}

// ════════════════════════════════════
//  LIGHTBOX
// ════════════════════════════════════
let lbImgs=[], lbIdx=0;
function openLightbox(src) {
  const c=cases.find(x=>x.id===viewId);
  lbImgs=c?.imgs||[src];
  lbIdx=lbImgs.indexOf(src); if(lbIdx<0) lbIdx=0;
  lbShow();
  document.getElementById('lightbox').classList.add('open');
}
function lbShow() {
  document.getElementById('lb-img').src=lbImgs[lbIdx];
  document.getElementById('lb-counter').textContent=(lbIdx+1)+' / '+lbImgs.length;
}
function lbNav(dir) { lbIdx=(lbIdx+dir+lbImgs.length)%lbImgs.length; lbShow(); }
function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }
function closeLightboxBg(e) { if(e.target===document.getElementById('lightbox')) closeLightbox(); }
document.addEventListener('keydown',e=>{
  if(!document.getElementById('lightbox').classList.contains('open')) return;
  if(e.key==='ArrowLeft')  lbNav(-1);
  if(e.key==='ArrowRight') lbNav(1);
  if(e.key==='Escape')     closeLightbox();
});
</script>


<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightboxBg(event)">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <button class="lightbox-nav lightbox-prev" onclick="lbNav(-1)">‹</button>
  <img id="lb-img" src="" alt="">
  <button class="lightbox-nav lightbox-next" onclick="lbNav(1)">›</button>
  <div class="lightbox-counter" id="lb-counter"></div>
</div>

<!-- FAB -->
<button class="mobile-fab" onclick="openEditModal(null)">＋</button>
